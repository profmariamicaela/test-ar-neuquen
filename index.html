<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Experiencia AR - Dinosaurio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #status-msg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      text-align: center;
      display: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status-msg">Iniciando AR...</div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let dinoModel = null;
    let mixer = null;
    const clock = new THREE.Clock();

    let floorDetected = false;
    let angle = -Math.PI / 2;
    const radius = 1.6;
    const speed = 0.45;
    let centerPos = new THREE.Vector3();

    const statusMsg = document.getElementById('status-msg');

    init();

    function showStatus(text, duration = 3000) {
      statusMsg.innerText = text;
      statusMsg.style.display = 'block';
      if (duration > 0) {
        setTimeout(() => {
          statusMsg.style.display = 'none';
        }, duration);
      }
    }

    function init() {
      // 1. Escena y cámara básica
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // 2. Iluminación
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
      dirLight.position.set(0, 5, 2);
      scene.add(dirLight);

      // 3. Renderer con WebXR activado
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 4. Botón AR nativo oficial de Three.js (Evita bloqueos de superposición de Android)
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test']
      });
      document.body.appendChild(arButton);

      // 5. Cargar modelo 3D
      const loader = new GLTFLoader();
      loader.load(
        './dinorun.glb',
        (gltf) => {
          dinoModel = gltf.scene;
          dinoModel.visible = false;
          dinoModel.scale.set(0.35, 0.35, 0.35);

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(dinoModel);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
          }

          scene.add(dinoModel);
        },
        undefined,
        (err) => console.error('Error cargando dinorun.glb:', err)
      );

      // Eventos de sesión WebXR
      renderer.xr.addEventListener('sessionstart', () => {
        showStatus('Apunta la cámara hacia el suelo...', 5000);
      });

      renderer.xr.addEventListener('sessionend', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
        floorDetected = false;
        if (dinoModel) dinoModel.visible = false;
      });

      renderer.setAnimationLoop(render);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && !floorDetected) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            centerPos.set(
              pose.transform.position.x,
              pose.transform.position.y,
              pose.transform.position.z - radius
            );

            floorDetected = true;
            if (dinoModel) dinoModel.visible = true;
            showStatus('¡Piso detectado!', 2000);
          }
        }
      }

      // Animación en órbita circular
      if (floorDetected && dinoModel) {
        angle += speed * delta;

        const posX = centerPos.x + radius * Math.cos(angle);
        const posZ = centerPos.z + radius * Math.sin(angle);
        const posY = centerPos.y;

        dinoModel.position.set(posX, posY, posZ);

        const lookTarget = new THREE.Vector3(
          posX - Math.sin(angle),
          posY,
          posZ + Math.cos(angle)
        );
        dinoModel.lookAt(lookTarget);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
