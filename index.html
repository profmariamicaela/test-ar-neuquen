<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Experiencia AR - Dinosaurio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #camera-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      margin-top: 24px;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      background: #00e676;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
    }
  </style>

  <!-- Three.js universal via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Video nativo de la cámara trasera -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- Lienzo 3D encima de la cámara -->
  <canvas id="three-canvas"></canvas>

  <!-- Botón inicial directo (requerido por navegadores para activar cámara y audio) -->
  <div id="start-screen">
    <h2>Dinosaurio AR</h2>
    <p>Presiona el botón para abrir la cámara y ver al dinosaurio en el piso</p>
    <button id="start-btn">Iniciar Experiencia</button>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('three-canvas');

    let scene, camera, renderer, mixer;
    let dinoModel = null;
    const clock = new THREE.Clock();

    // Trayectoria circular del dinosaurio
    let angle = -Math.PI / 2; // Inicia alejado al frente
    const radius = 2.0;       // Radio del círculo en metros
    const speed = 0.55;       // Velocidad del recorrido

    // Posición del centro del círculo en el piso simulado
    const centerPos = new THREE.Vector3(0, -1.3, -3.2);

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.innerText = "Abriendo cámara...";

      try {
        // 1. Abrir la cámara trasera directamente sin WebXR
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        // Ocultar pantalla inicial
        startScreen.style.display = 'none';

        // 2. Inicializar entorno 3D
        initThree();
      } catch (err) {
        alert("No se pudo acceder a la cámara: " + err.name + " - " + err.message);
        startBtn.disabled = false;
        startBtn.innerText = "Reintentar";
      }
    });

    function initThree() {
      // Escena con fondo transparente (para ver el video detrás)
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Iluminación
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x555555, 1.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
      dirLight.position.set(2, 6, 3);
      scene.add(dirLight);

      // Cargar modelo dinorun.glb
      const loader = new THREE.GLTFLoader();
      loader.load(
        './dinorun.glb',
        (gltf) => {
          dinoModel = gltf.scene;
          dinoModel.scale.set(0.35, 0.35, 0.35);

          // Iniciar animación embebida en el modelo
          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(dinoModel);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
          }

          scene.add(dinoModel);
        },
        undefined,
        (err) => console.error("Error al cargar modelo:", err)
      );

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (dinoModel) {
        // Movimiento circular continuo: se acerca, dobla a su derecha y regresa
        angle += speed * delta;

        const posX = centerPos.x + radius * Math.cos(angle);
        const posZ = centerPos.z + radius * Math.sin(angle);
        const posY = centerPos.y; // Nivel constante del suelo

        dinoModel.position.set(posX, posY, posZ);

        // Hace que mire exactamente en la dirección hacia donde se traslada
        const lookTarget = new THREE.Vector3(
          posX - Math.sin(angle),
          posY,
          posZ + Math.cos(angle)
        );
        dinoModel.lookAt(lookTarget);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
