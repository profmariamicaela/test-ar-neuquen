<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinosaurio AR</title>
  
  <!-- Librería oficial de Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!--
    ar-placement="floor": Garantiza que el dinosaurio se ancle al suelo real.
    ar-modes="scene-viewer webxr quick-look": Da prioridad al visor nativo de Android si WebXR falla.
    autoplay: Ejecuta la animación dinorun automáticamente.
  -->
  <model-viewer 
    src="./dinorun.glb" 
    ar 
    ar-placement="floor"
    ar-modes="scene-viewer webxr quick-look" 
    camera-controls 
    autoplay
    shadow-intensity="1"
    environment-image="neutral"
    alt="Modelo 3D de Dinosaurio corriendo">
    
    <button slot="ar-button" id="ar-button">
      Abrir Cámara y Colocar en el Piso
    </button>
  </model-viewer>

</body>
</html>
